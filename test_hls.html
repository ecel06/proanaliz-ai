<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.4/dist/hls.min.js"></script>
</head>
<body>
  <video id="v" controls autoplay muted style="width: 600px; height: 350px; background: black;"></video>
  <pre id="log" style="font-size: 11px; max-height: 200px; overflow: auto;"></pre>
  <script>
    const log = (msg) => {
      document.getElementById('log').textContent += msg + '\n';
      console.log(msg);
    };
    const video = document.getElementById('v');
    const url = 'https://nesine-spinemedia-live.ercdn.net/yaristayiz/yaristayiz.m3u8';
    
    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        debug: true,
        liveDurationInfinity: true,
      });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => log('Manifest parsed'));
      hls.on(Hls.Events.LEVEL_UPDATED, (e, d) => log('Level updated: seq=' + d.details.startSN + ' count=' + d.details.fragments.length));
      hls.on(Hls.Events.FRAG_LOADED, (e, d) => log('Frag loaded: ' + d.frag.sn));
      hls.on(Hls.Events.ERROR, (e, d) => log('Error: ' + d.type + ' ' + d.details + ' fatal=' + d.fatal));
    }
  </script>
</body>
</html>
